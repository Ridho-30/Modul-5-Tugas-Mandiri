<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Rizz Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toast" class="toast hidden"></div>
    <div id="auth-view">
        <div class="auth-box glass-panel">
            <div class="brand">
                <i class="fa-solid fa-book-journal-whills"></i>
                <h1><span>Rizz</span> Library</h1>
            </div>

            <div class="auth-tabs">
                <button class="active">Masuk</button>
                <button onclick="window.location.href='register.html'">Daftar</button>
            </div>

            <form id="login-form" class="auth-form active">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Masuk <i class="fa-solid fa-arrow-right"></i></button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../services/api_service.js"></script>
    <script src="../services/auth_service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AuthService.redirectIfAuth();
        });

        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            toastEl.textContent = message;
            toastEl.className = `toast show ${type}`;
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 3000);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await AuthService.login(email, password);
                localStorage.setItem('token', res.data.accessToken);
                localStorage.setItem('user', JSON.stringify(res.data.user));
                window.location.href = 'index.html';
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>

</html>
